name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.14"}
          - {os: macos-latest, python: "3.13"}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: bash -n install.sh
      # pwsh ships on GitHub-hosted Linux and macOS runners; parse errors fail the job,
      # so install.ps1 gets real syntax coverage without a Windows runner.
      - name: Syntax-check install.ps1
        run: |
          command -v pwsh >/dev/null || { echo "pwsh not present; skipping"; exit 0; }
          pwsh -NoProfile -Command '$e = $null; $null = [System.Management.Automation.Language.Parser]::ParseFile("install.ps1", [ref]$null, [ref]$e); if ($e.Count) { $e; exit 1 }'
      - run: python3 scripts/project_context.py self-check --skill-root .
      - run: python3 -m unittest discover -s tests -v
      # Whole-tree whitespace lint (explicit: diff against the empty tree, stable under shallow clones)
      - run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

  installer:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the installer resolves the latest release tag from the clone source
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run install.sh against this checkout (cross-version update path)
        if: runner.os != 'Windows'
        run: |
          export PROJECT_CONTEXT_HOME="$RUNNER_TEMP/pc-home"
          export PROJECT_CONTEXT_REPO="$PWD"
          export PROJECT_CONTEXT_NO_JCODEMUNCH=1 # hermetic: no PyPI dependency in CI
          # Pre-seed a fake legacy full copy so the archive branch actually executes.
          mkdir -p "$PROJECT_CONTEXT_HOME/.claude/skills/project-context/auditors"
          echo legacy > "$PROJECT_CONTEXT_HOME/.claude/skills/project-context/SKILL.md"
          PROJECT_CONTEXT_VERSION=v0.4.0 bash install.sh
          grep -qx "0.4.0" "$PROJECT_CONTEXT_HOME/.agents/skills/project-context/VERSION"
          bash install.sh # unpinned second run must perform a real version change
          test "$(cat "$PROJECT_CONTEXT_HOME/.agents/skills/project-context/VERSION")" != "0.4.0"
          test -f "$PROJECT_CONTEXT_HOME/.claude/skills/project-context/SKILL.md"
          ls "$PROJECT_CONTEXT_HOME/.skill-backups" | grep -q claude-project-context

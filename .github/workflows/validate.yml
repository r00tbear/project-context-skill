name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.14"}
          - {os: macos-latest, python: "3.13"}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: bash -n install.sh
      # Parse locally on these runners; the windows-installer job also runs both shells.
      - name: Syntax-check install.ps1
        run: |
          command -v pwsh >/dev/null || { echo "pwsh not present; skipping"; exit 0; }
          pwsh -NoProfile -Command '$e = $null; $null = [System.Management.Automation.Language.Parser]::ParseFile("install.ps1", [ref]$null, [ref]$e); if ($e.Count) { $e; exit 1 }'
      - run: python3 scripts/project_context.py self-check --skill-root .
      - run: python3 -m unittest discover -s tests -v
      # Whole-tree whitespace lint (explicit: diff against the empty tree, stable under shallow clones)
      - run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

  installer:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the installer resolves the latest release tag from the clone source
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run install.sh against this checkout (cross-version update path)
        if: runner.os != 'Windows'
        run: |
          export PROJECT_CONTEXT_HOME="$RUNNER_TEMP/pc-home"
          export PROJECT_CONTEXT_REPO="$PWD"
          export PROJECT_CONTEXT_NO_JCODEMUNCH=1 # hermetic: no PyPI dependency in CI
          # Pre-seed a fake legacy full copy so the archive branch actually executes.
          mkdir -p "$PROJECT_CONTEXT_HOME/.claude/skills/project-context/auditors"
          echo legacy > "$PROJECT_CONTEXT_HOME/.claude/skills/project-context/SKILL.md"
          PROJECT_CONTEXT_VERSION=v0.4.0 bash install.sh
          grep -qx "0.4.0" "$PROJECT_CONTEXT_HOME/.agents/skills/project-context/VERSION"
          bash install.sh # unpinned second run must perform a real version change
          test "$(cat "$PROJECT_CONTEXT_HOME/.agents/skills/project-context/VERSION")" != "0.4.0"
          test -f "$PROJECT_CONTEXT_HOME/.claude/skills/project-context/SKILL.md"
          ls "$PROJECT_CONTEXT_HOME/.skill-backups" | grep -q claude-project-context

  windows-installer:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        powershell: [pwsh, powershell.exe]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Exercise install.ps1 and junction preflight on real Windows
        shell: pwsh
        run: |
          git tag v0.6.0-ci $env:GITHUB_SHA
          $env:PROJECT_CONTEXT_REPO = $PWD.Path
          $env:PROJECT_CONTEXT_VERSION = 'v0.6.0-ci'
          $env:PROJECT_CONTEXT_NO_JCODEMUNCH = '1'
          $env:PROJECT_CONTEXT_HOME = Join-Path $env:RUNNER_TEMP 'project-context-home'
          New-Item -ItemType Directory -Force $env:PROJECT_CONTEXT_HOME | Out-Null
          & ${{ matrix.powershell }} -NoProfile -File install.ps1
          if ($LASTEXITCODE -ne 0) { throw 'initial installer failed' }
          & ${{ matrix.powershell }} -NoProfile -File install.ps1
          if ($LASTEXITCODE -ne 0) { throw 'installer update failed' }
          $outside = Join-Path $env:RUNNER_TEMP 'project-context-outside'
          New-Item -ItemType Directory -Force $outside | Out-Null
          Set-Content -LiteralPath (Join-Path $outside 'SKILL.md') -Value 'canary'
          $env:PROJECT_CONTEXT_HOME = Join-Path $env:RUNNER_TEMP 'project-context-junction-home'
          $adapterParent = Join-Path $env:PROJECT_CONTEXT_HOME '.claude\skills'
          New-Item -ItemType Directory -Force $adapterParent | Out-Null
          New-Item -ItemType Junction -Path (Join-Path $adapterParent 'project-context') -Target $outside | Out-Null
          $priorPreference = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          & ${{ matrix.powershell }} -NoProfile -File install.ps1 2>$null
          $junctionExit = $LASTEXITCODE
          $ErrorActionPreference = $priorPreference
          if ($junctionExit -eq 0) { throw 'installer accepted a junction' }
          $global:LASTEXITCODE = 0
          if ((Get-Content -LiteralPath (Join-Path $outside 'SKILL.md') -Raw).Trim() -ne 'canary') { throw 'outside canary changed' }
          if (Test-Path (Join-Path $env:PROJECT_CONTEXT_HOME '.agents\skills\project-context')) { throw 'payload written before preflight failure' }
